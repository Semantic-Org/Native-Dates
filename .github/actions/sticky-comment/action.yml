name: Sticky comment
description: Posts a comment on a pull request, or edits the one it posted before, found by a marker in its body.

inputs:
  token:
    description: A token that may comment on the pull request.
    required: true
  pr-number:
    description: The pull request to comment on.
    required: true
  marker:
    description: A line the comment carries, such as an html comment, that tells it from every other.
    required: true
  body-file:
    description: The file holding the comment.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.pr-number }}
        MARKER: ${{ inputs.marker }}
        BODY_FILE: ${{ inputs.body-file }}
      run: |
        # only a bot's comment is edited, so a person quoting the marker is never written over
        EXISTING=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
          --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"$MARKER\"))) | .id" | tail -n1)
        if [ -n "$EXISTING" ]; then
          jq -nR --rawfile body "$BODY_FILE" '{body: $body}' \
            | gh api "repos/$REPO/issues/comments/$EXISTING" -X PATCH --input - > /dev/null
        else
          gh pr comment "$PR" --repo "$REPO" --body-file "$BODY_FILE"
        fi
