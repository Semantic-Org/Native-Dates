name: Sticky bot comment
description: Post a comment on a PR under a bot identity, or edit the bot's prior comment in place.

inputs:
  token:
    description: GitHub App installation token for the bot.
    required: true
  repo:
    description: owner/name of the repository.
    required: true
  pr-number:
    description: Pull request number to comment on.
    required: true
  bot-login:
    description: The bot's comment-author login, e.g. semantic-bundle-bot[bot].
    required: true
  body-file:
    description: Path to the rendered comment body.
    required: true
  marker:
    description: Hidden HTML comment prepended to the body to distinguish multiple comments from the same bot login. When empty, matches by login alone.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr-number }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        BODY_FILE: ${{ inputs.body-file }}
        MARKER: ${{ inputs.marker }}
      run: |
        # Edit the bot's prior comment in place. Filtering REST results by
        # user.login is stable across short-lived installation tokens, where
        # `gh pr comment --edit-last` can drift and post a duplicate.
        # The marker keeps two report workflows that fall back to
        # github-actions[bot] from editing each other's comment.
        BODY="$BODY_FILE"
        if [ -n "$MARKER" ]; then
          BODY="$RUNNER_TEMP/sticky-bot-comment.md"
          { printf '%s\n' "$MARKER"; cat "$BODY_FILE"; } > "$BODY"
        fi
        EXISTING_ID=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
          | jq -r --arg login "$BOT_LOGIN" --arg marker "$MARKER" \
            '.[] | select(.user.login == $login and (.body | startswith($marker))) | .id' | tail -n1)
        if [ -n "$EXISTING_ID" ]; then
          jq -nR --rawfile body "$BODY" '{body: $body}' \
            | gh api "repos/$REPO/issues/comments/$EXISTING_ID" -X PATCH --input -
        else
          gh pr comment "$PR" --repo "$REPO" --body-file "$BODY"
        fi
