name: Bundle Size

# builds PR code, so its token cannot post: bundle-size-report.yml posts the comment.
# tools/ci/bundle/README.md is the page

on:
  # a PR starts a run only when it touches a path below, what the measurement reads or is built
  # with, so a change to the docs or a test costs no minutes. tools/ci/bundle/budget.test.js holds
  # every file in a bundle to this list
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # the sources the bundles are built from, and the exports and sideEffects that decide what a
      # bundle holds
      - 'src/**'
      - 'packages/plugins/src/**'
      - 'packages/plugins/package.json'
      - 'package.json'
      # the rows, the check, the prose reader and the budget they are held to
      - 'tools/size.js'
      - 'tools/gates/budget.js'
      - 'tools/gates/prose.js'
      - 'ai/contributing/budget.md'
      # the reporter and its page
      - 'tools/ci/bundle/**'
      # this workflow, which a PR runs from its own copy
      - '.github/workflows/bundle-size.yml'
      # the bundler's version, and the node whose zlib compresses
      - 'package-lock.json'
      - '.node-version'

concurrency:
  group: bundle-size-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      # the checkout is the PR merged onto its base branch's tip, and that tip is the merge's first
      # parent, so a PR behind main reads its own bytes and never main's other merges
      - name: Checkout Head
        uses: actions/checkout@v7
        with:
          path: head
          fetch-depth: 2
      - name: Find Base
        id: base
        run: echo "sha=$(git -C head rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - name: Checkout Base
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: head/.node-version
      # no install script runs, and the PR's code is bundled by esbuild and never executed
      - name: Install Dependencies
        run: |
          (cd base && npm ci --ignore-scripts --no-audit --no-fund)
          (cd head && npm ci --ignore-scripts --no-audit --no-fund)
      # the base's copy weighs the PR, so a PR cannot move the ceiling or the rows for its own run
      - name: Use Main's Tools
        id: tools
        run: |
          if [ -f base/tools/ci/bundle/reporter.js ]; then
            echo "dir=base" >> "$GITHUB_OUTPUT"
            echo "measuring with the base's tools"
          else
            echo "dir=head" >> "$GITHUB_OUTPUT"
            echo "the base has no tools/ci/bundle yet, so this PR's copy measures itself"
          fi
      - name: List Changed Files
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/size"
          jq -n --arg head "$(git -C head rev-parse HEAD)" --arg base "$BASE_SHA" --arg ref "$BASE_REF" \
            --arg files "$(git -C head -c core.quotepath=false diff --name-only HEAD^1 HEAD)" \
            '{ head: { sha: $head }, base: { sha: $base, ref: $ref }, files: ($files | split("\n") | map(select(. != ""))) }' > "$RUNNER_TEMP/size/changed.json"
      # the one step that fails a pull request. the steps after it still run, so a red check has its report
      - name: Check the Budget
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
        run: node "$TOOLS/tools/gates/budget.js" --head head --base base --title "$TITLE" --json "$RUNNER_TEMP/size"
      - name: Write Bundle Size Report
        if: ${{ !cancelled() }}
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          node "$TOOLS/tools/ci/bundle/reporter.js" --results "$RUNNER_TEMP/size" --sha "$SHA" --ref "$REF" --msg "$TITLE" --pr "$PR" \
            --body "$RUNNER_TEMP/body.md" --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL" --run-id "$GITHUB_RUN_ID" --report-url "$RUN_URL" --out "$RUNNER_TEMP/report"
          cat "$RUNNER_TEMP/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save Size Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: size-results
          path: ${{ runner.temp }}/size
          if-no-files-found: error
      # the summary's size-report.json link opens this run's page, so the file is uploaded here
      - name: Save Bundle Size Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: size-report
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
