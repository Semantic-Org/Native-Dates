name: Bundle Size

# bundles PR code with read-only permissions, while bundle-size-report.yml posts the PR comment.
# See tools/ci/bundle/README.md for details

on:
  # runs only when a PR touches bundled sources, package manifests, or measurement config.
  # tools/ci/bundle/budget.test.js verifies every bundled source file matches this list
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'packages/plugins/src/**'
      - 'packages/plugins/package.json'
      - 'package.json'
      - 'tools/size.js'
      - 'tools/gates/budget.js'
      - 'tools/gates/prose.js'
      - 'ai/contributing/budget.md'
      - 'tools/ci/bundle/**'
      - '.github/workflows/bundle-size.yml'
      - 'package-lock.json'
      - '.node-version'

concurrency:
  group: bundle-size-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      # compare the PR merge commit against its first parent on the base branch to isolate PR changes
      - name: Checkout Head
        uses: actions/checkout@v7
        with:
          path: head
          fetch-depth: 2
      - name: Find Base
        id: base
        run: echo "sha=$(git -C head rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - name: Checkout Base
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: head/.node-version
      # skip lifecycle scripts and bundle PR code with esbuild without executing it
      - name: Install Dependencies
        run: |
          (cd base && npm ci --ignore-scripts --no-audit --no-fund)
          (cd head && npm ci --ignore-scripts --no-audit --no-fund)
      # run measurement scripts from the base branch so a PR cannot raise its own budget
      - name: Use Main's Tools
        id: tools
        run: |
          if [ -f base/tools/ci/bundle/reporter.js ]; then
            echo "dir=base" >> "$GITHUB_OUTPUT"
            echo "measuring with base branch tools"
          else
            echo "dir=head" >> "$GITHUB_OUTPUT"
            echo "base branch predates tools/ci/bundle, falling back to head tools"
          fi
      - name: List Changed Files
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/size"
          jq -n --arg head "$(git -C head rev-parse HEAD)" --arg base "$BASE_SHA" --arg ref "$BASE_REF" \
            --arg files "$(git -C head -c core.quotepath=false diff --name-only HEAD^1 HEAD)" \
            '{ head: { sha: $head }, base: { sha: $base, ref: $ref }, files: ($files | split("\n") | map(select(. != ""))) }' > "$RUNNER_TEMP/size/changed.json"
      # report and artifact upload steps use !cancelled() so failing checks still publish their report
      - name: Check the Budget
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
        run: node "$TOOLS/tools/gates/budget.js" --head head --base base --title "$TITLE" --json "$RUNNER_TEMP/size"
      - name: Write Bundle Size Report
        if: ${{ !cancelled() }}
        env:
          TOOLS: ${{ steps.tools.outputs.dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          node "$TOOLS/tools/ci/bundle/reporter.js" --results "$RUNNER_TEMP/size" --sha "$SHA" --ref "$REF" --msg "$TITLE" --pr "$PR" \
            --body "$RUNNER_TEMP/body.md" --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL" --run-id "$GITHUB_RUN_ID" --report-url "$RUN_URL" --out "$RUNNER_TEMP/report"
          cat "$RUNNER_TEMP/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save Size Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: size-results
          path: ${{ runner.temp }}/size
          if-no-files-found: error
      - name: Save Bundle Size Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: size-report
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
