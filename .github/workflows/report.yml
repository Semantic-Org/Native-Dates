name: Report

# Posts or updates sticky Size and Bench comments on pull requests from main-branch scripts.
# Runs automatically when Size or Bench completes on a pull_request event.
on:
  workflow_run:
    workflows: [Size, Bench]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    name: Comment on pull request
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KIND: ${{ github.event.workflow_run.name == 'Size' && 'size' || 'bench' }}
      BOT_CLIENT_ID: ${{ github.event.workflow_run.name == 'Size' && secrets.SEMANTIC_BUNDLE_BOT_CLIENT_ID || secrets.SEMANTIC_PERF_BOT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download measurement artifact
        id: measured
        run: |
          if gh run download '${{ github.event.workflow_run.id }}' --repo "$REPO" --name "$KIND" --dir "$RUNNER_TEMP/measured"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # fork PRs omit pull_requests[0] on workflow_run, so fall back to matching head_branch
      - name: Resolve pull request number
        id: pr
        if: steps.measured.outputs.found == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          number='${{ github.event.workflow_run.pull_requests[0].number }}'
          if [ -z "$number" ]; then
            number=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // ""')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Render comment markdown
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          if [ "$KIND" = size ]; then
            title=$(gh pr view "$PR" --repo "$REPO" --json title --jq .title)
            body=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body)
            node tools/ci/size-comment.js --sizes "$RUNNER_TEMP/measured/size.json" --title "$title" --body "$body" > "$RUNNER_TEMP/comment.md"
          else
            node tools/ci/bench-comment.js --results "$RUNNER_TEMP/measured" > "$RUNNER_TEMP/comment.md"
          fi

      - name: Create GitHub App token
        id: bot
        if: steps.pr.outputs.number != '' && env.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.BOT_CLIENT_ID }}
          private-key: ${{ github.event.workflow_run.name == 'Size' && secrets.SEMANTIC_BUNDLE_BOT_PRIVATE_KEY || secrets.SEMANTIC_PERF_BOT_PRIVATE_KEY }}

      - name: Post or update sticky comment
        if: steps.pr.outputs.number != ''
        uses: ./.github/actions/sticky-comment
        with:
          token: ${{ steps.bot.outputs.token || github.token }}
          pr-number: ${{ steps.pr.outputs.number }}
          marker: '<!-- ${{ env.KIND }} -->'
          body-file: ${{ runner.temp }}/comment.md
