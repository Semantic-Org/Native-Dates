name: Bundle Size Report

# posts the bundle size comment after a Bundle Size run, whatever its conclusion, so a red check
# still gets its comment. workflow_run gives it the base repo's secrets and main's tools/ci/bundle,
# so a PR never authors the tool that judges it

on:
  workflow_run:
    workflows: [Bundle Size]
    types: [completed]

permissions:
  contents: read

# a group per run: GitHub keeps one waiting run per group and cancels the one before it
concurrency:
  group: bundle-size-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    name: Post Bundle Size Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Check Bot Secrets
        id: bot
        env:
          HAS_BOT: ${{ secrets.SEMANTIC_BUNDLE_BOT_CLIENT_ID != '' && secrets.SEMANTIC_BUNDLE_BOT_PRIVATE_KEY != '' }}
        run: echo "has=$HAS_BOT" >> "$GITHUB_OUTPUT"
      # continue-on-error on purpose: the comment posts under the workflow token when the app is missing or down
      - name: Create Bot Token
        id: bot-token
        if: steps.bot.outputs.has == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SEMANTIC_BUNDLE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_BUNDLE_BOT_PRIVATE_KEY }}
      # sticky-bot-comment finds the prior comment by this login
      - name: Choose Token
        id: token
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
          BOT_SLUG: ${{ steps.bot-token.outputs.app-slug }}
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          echo "value=${BOT_TOKEN:-$WORKFLOW_TOKEN}" >> "$GITHUB_OUTPUT"
          if [ -n "$BOT_TOKEN" ] && [ -n "$BOT_SLUG" ]; then echo "login=$BOT_SLUG[bot]" >> "$GITHUB_OUTPUT"; else echo "login=github-actions[bot]" >> "$GITHUB_OUTPUT"; fi

      # main, for the tool. the reported run comes from the event. the reporter imports nothing, so
      # nothing is installed in the job that holds the token
      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # github.token, not the app's: the app holds pull requests alone and cannot list another run's artifacts
      - name: Download Size Results
        id: results
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name size-results --dir "$RUNNER_TEMP/size" || true
          if [ ! -f "$RUNNER_TEMP/size/head.json" ] || [ ! -f "$RUNNER_TEMP/size/base.json" ]; then
            echo "report=false" >> "$GITHUB_OUTPUT"; echo "no measurement uploaded, nothing to report"; exit 0
          fi
          echo "report=true" >> "$GITHUB_OUTPUT"

      - name: Find Pull Request
        id: pr
        if: steps.results.outputs.report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          # a PR from a fork is not in the event, so it is found by its branch
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            NUMBER=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // ""')
          fi
          if [ -n "$NUMBER" ]; then
            HEAD=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
            if [ "$HEAD" != "$HEAD_SHA" ]; then echo "#$NUMBER has moved on to ${HEAD:0:7}, so this run on ${HEAD_SHA:0:7} leaves the comment to it"; NUMBER=''; fi
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Resolved PR number: $NUMBER"

      # the reporter quotes the body's Expected bytes: line
      - name: Read Pull Request Body
        if: steps.results.outputs.report == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr view "$NUMBER" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/body.md"

      - name: Render Bundle Size Report
        id: render
        if: steps.results.outputs.report == 'true'
        env:
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          touch "$RUNNER_TEMP/body.md"
          node tools/ci/bundle/reporter.js \
            --results "$RUNNER_TEMP/size" \
            --sha "$HEAD_SHA" --ref "$HEAD_BRANCH" --msg "$DISPLAY_TITLE" ${NUMBER:+--pr "$NUMBER"} \
            --body "$RUNNER_TEMP/body.md" --repo "$REPO" \
            --run-url "$RUN_URL" --run-id "$RUN_ID" --report-url "$REPORT_URL" \
            --out size-report
          echo "post=$(jq -r .post size-report/size-report.json)" >> "$GITHUB_OUTPUT"
          cat size-report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save Bundle Size Report
        uses: actions/upload-artifact@v7
        if: steps.results.outputs.report == 'true'
        with:
          overwrite: true
          name: size-report
          path: size-report

      # post is the reporter's call. a zero says so on the summary page instead
      - name: Post Comment
        if: steps.results.outputs.report == 'true' && steps.render.outputs.post == 'true' && steps.pr.outputs.number != ''
        uses: ./.github/actions/sticky-bot-comment
        with:
          token: ${{ steps.token.outputs.value }}
          repo: ${{ github.repository }}
          pr-number: ${{ steps.pr.outputs.number }}
          bot-login: ${{ steps.token.outputs.login }}
          body-file: size-report/comment.md
          marker: '<!-- bundle-size-report -->'
