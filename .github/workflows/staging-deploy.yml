name: Staging Deploy

# deploys docs to staging (staging.nativedates.dev) on pushes to main that affect docs or packages.
# Vercel's Git integration is disabled in docs/vercel.json so prebuilt workflow deploys are the only path.
# Requires: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_NATIVEDATES_PROJECT_ID

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'packages/**'
      - 'ai/skills/**'
      - 'CHANGELOG.md'
      - 'tools/size.js'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/staging-deploy.yml'

concurrency:
  # a newer main push supersedes an in-flight staging build
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Deploy docs to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_NATIVEDATES_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      # docs build executes native-dates at build time and requires a Node version with native Temporal
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      # shared Astro build cache across staging and release deploys
      - uses: actions/cache@v6
        with:
          path: docs/node_modules/.astro
          key: docs-astro-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            docs-astro-${{ runner.os }}-

      # run from repo root because Vercel's Root Directory is docs/. Pull loads staging SITE_URL
      # before building so canonical URLs and share cards use staging.nativedates.dev
      - name: Build and deploy docs to staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel pull --yes --environment=staging --token="$VERCEL_TOKEN"
          npx vercel build --environment=staging --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --environment=staging --token="$VERCEL_TOKEN"
