name: Test

# runs unit, DOM, and browser tests, checks bundle sizes and formatting, and builds docs
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium when browser tests exist
        run: |
          if [ -n "$(find . -path '*/test/browser/*.test.*' -not -path './node_modules/*' -print -quit)" ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Run tests and the size report
        run: npm run check

      - name: Check formatting
        run: npx dprint check

      - name: Build documentation site
        run: npm -w docs run build
