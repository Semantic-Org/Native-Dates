<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <h1>French dates and regional clocks</h1>
  <div class="controls">
    <label>Date <input id="day" type="date" value="2026-05-01"></label>
    <label>Time <input id="clock" type="time" value="09:30"></label>
    <label>Days <input id="span" type="number" min="1" max="45" value="4"></label>
  </div>
  <dl id="output"></dl>
</body>
</html>
