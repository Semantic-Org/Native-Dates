<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <h1>Chinese calendars and day periods</h1>
  <div class="controls">
    <label>Date <input id="day" type="date" value="2026-05-01"></label>
    <label>Time <input id="clock" type="time" value="09:30"></label>
  </div>
  <div class="presets">
    <button type="button" data-date="2026-02-17">Lunar New Year · 2026-02-17</button>
    <button type="button" data-date="2026-05-01">2026-05-01</button>
  </div>
  <ul id="output"></ul>
</body>
</html>
