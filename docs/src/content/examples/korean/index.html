<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <h1>Korean spacing and collapsed ranges</h1>
  <div class="controls">
    <label>Date <input id="day" type="date" value="2026-05-01"></label>
    <label>Span <input id="span" type="number" min="1" max="45" value="4"></label>
    <label>Time <input id="clock" type="time" value="14:30"></label>
  </div>
  <div class="presets">
    <button type="button" data-span="4">+4 days</button>
    <button type="button" data-span="35">+35 days</button>
  </div>
  <ul id="output"></ul>
</body>
</html>
