<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="bar">
    <h1 id="month"></h1>
    <div class="controls">
      <button id="prev" type="button" aria-label="Previous month">&larr;</button>
      <button id="today" type="button">Today</button>
      <button id="next" type="button" aria-label="Next month">&rarr;</button>
    </div>
  </div>
  <div id="weekdays" class="grid head"></div>
  <div id="days" class="grid days"></div>
</body>
</html>
