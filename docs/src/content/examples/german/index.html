<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <h1>German dates and calendar weeks</h1>
  <div class="controls">
    <label>Date <input id="day" type="date" value="2026-05-01"></label>
    <label>Days <input id="span" type="number" min="1" max="45" value="4"></label>
  </div>
  <div class="pills">
    <button type="button" data-date="2026-05-01">2026-05-01</button>
    <button type="button" data-date="2027-01-01">2027-01-01</button>
  </div>
  <dl id="output"></dl>
</body>
</html>
